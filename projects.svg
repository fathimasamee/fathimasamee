<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" role="img" aria-label="Projects" xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace}
:root{--bg:#FBF6F6;--card:#FFFFFF;--line:#800020;--gold:#B08D4A;--title:#2B0A14;--text:#6B4852;--tag:#F3E6E9;--tagt:#800020}
@media (prefers-color-scheme:dark){:root{--bg:#14070B;--card:#1F0B13;--line:#C0405C;--gold:#D9BC8A;--title:#F3E1E6;--text:#B99CA4;--tag:#2E1019;--tagt:#D9BC8A}}
.c{opacity:0;animation:in .8s ease forwards}
.c1{animation-delay:.1s}.c2{animation-delay:.35s}.c3{animation-delay:.6s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.b{animation:glow 4.5s ease-in-out infinite}
@keyframes glow{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
@media (prefers-reduced-motion:reduce){.c{animation:none;opacity:1}.b{animation:none}}
</style>
<defs><linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="var(--line)"/><stop offset="1" stop-color="var(--gold)"/></linearGradient></defs>
<text x="590.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="var(--gold)" letter-spacing="3">// FEATURED PROJECTS</text>

  

<g class="c c1">
  <rect class="b" x="0" y="52" width="372" height="220" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <rect x="1" y="53" width="370" height="4" rx="2" fill="url(#top)"/>

  <text x="22" y="94" font-size="13" fill="var(--gold)">01</text>
  <text x="22" y="120" font-size="20" font-weight="700" fill="var(--title)">Henna Ventures</text>

  <text x="22" y="150" font-size="13" fill="var(--text)">3D hand visualization with interactive henna</text>
  <text x="22" y="170" font-size="13" fill="var(--text)">designs, bookings and artist allocation.</text>

  <rect x="22" y="194" width="60" height="24" rx="12" fill="var(--tag)"/>
  <text x="52" y="210" text-anchor="middle" font-size="12" fill="var(--tagt)">React</text>

  <rect x="90" y="194" width="80" height="24" rx="12" fill="var(--tag)"/>
  <text x="130" y="210" text-anchor="middle" font-size="12" fill="var(--tagt)">Three.js</text>

  <rect x="178" y="194" width="80" height="24" rx="12" fill="var(--tag)"/>
  <text x="218" y="210" text-anchor="middle" font-size="12" fill="var(--tagt)">MongoDB</text>

  <a href="https://github.com/fathimasamee">
    <text x="22" y="250" font-size="12" fill="var(--gold)">View on GitHub →</text>
  </a>
</g>



  

<g class="c c2">
  <rect class="b" x="404" y="52" width="372" height="220" rx="12" fill="var(--card)" stroke="var(--line)"/>
  <rect x="405" y="53" width="370" height="4" rx="2" fill="url(#top)"/>

  <text x="426" y="94" font-size="13" fill="var(--gold)">02</text>
  <text x="426" y="120" font-size="20" font-weight="700" fill="var(--title)">AI live yoga trainer</text>

  <text x="426" y="150" font-size="13" fill="var(--text)">Recognizes emotions and recommends suitable yoga poses</text>
  <text x="426" y="170" font-size="13" fill="var(--text)">with real-time pose detection and correction.</text>

  <rect x="426" y="194" width="60" height="24" rx="12" fill="var(--tag)"/>
  <text x="456" y="210" text-anchor="middle" font-size="12" fill="var(--tagt)">Python</text>

  <rect x="494" y="194" width="66" height="24" rx="12" fill="var(--tag)"/>
  <text x="527" y="210" text-anchor="middle" font-size="12" fill="var(--tagt)">OpenCV</text>

  <rect x="568" y="194" width="84" height="24" rx="12" fill="var(--tag)"/>
  <text x="610" y="210" text-anchor="middle" font-size="12" fill="var(--tagt)">MediaPipe</text>

  <a href="https://github.com/fathimasamee/Detect-Yoga-Poses-And-Correction-In-Real-Time-Using-Machine-Learning-Algorithms-main">
    <text x="426" y="250" font-size="12" fill="var(--gold)">View Research Project on GitHub →</text>
  </a>
</g>



  
<g class="c c3">
<rect class="b" x="808" y="52" width="372" height="220" rx="12" fill="var(--card)" stroke="var(--line)"/>
<rect x="809" y="53" width="370" height="4" rx="2" fill="url(#top)"/>
<text x="830" y="94" font-size="13" fill="var(--gold)">03</text>
<text x="830" y="120" font-size="20" font-weight="700" fill="var(--title)">Project Three</text>
<text x="830" y="150" font-size="13" fill="var(--text)">Short one-line description of what thi</text>
<text x="830" y="170" font-size="13" fill="var(--text)">s project does and why it matters.</text>
<rect x="830" y="194" width="44" height="24" rx="12" fill="var(--tag)"/><text x="852.0" y="210" text-anchor="middle" font-size="12" fill="var(--tagt)">SAP</text>
<rect x="882" y="194" width="52" height="24" rx="12" fill="var(--tag)"/><text x="908.0" y="210" text-anchor="middle" font-size="12" fill="var(--tagt)">ABAP</text>
<rect x="942" y="194" width="60" height="24" rx="12" fill="var(--tag)"/><text x="972.0" y="210" text-anchor="middle" font-size="12" fill="var(--tagt)">Fiori</text>
<text x="830" y="250" font-size="12" fill="var(--gold)">github.com/fathimasamee/project-three →</text></g>



  
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
