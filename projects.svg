<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780" role="img" aria-label="Projects" xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace}
:root{--card:#FFFFFF;--line:#800020;--gold:#B08D4A;--title:#2B0A14;--text:#6B4852;--tag:#F3E6E9;--tagt:#800020}
@media (prefers-color-scheme:dark){:root{--card:#1F0B13;--line:#C0405C;--gold:#D9BC8A;--title:#F3E1E6;--text:#B99CA4;--tag:#2E1019;--tagt:#D9BC8A}}
.c{opacity:0;animation:in .8s ease forwards}
.c1{animation-delay:0.1s}.c2{animation-delay:0.3s}.c3{animation-delay:0.5s}.c4{animation-delay:0.7s}.c5{animation-delay:0.9s}.c6{animation-delay:1.1s}.c7{animation-delay:1.3s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.b{animation:glow 4.5s ease-in-out infinite}
@keyframes glow{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
@media (prefers-reduced-motion:reduce){.c{animation:none;opacity:1}.b{animation:none}}
</style>
<defs><linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="var(--line)"/><stop offset="1" stop-color="var(--gold)"/></linearGradient></defs>
